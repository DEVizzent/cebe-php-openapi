name: Code Style

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: cs2pr

      - name: Install PHP-CS-Fixer
        run: make php-cs-fixer.phar

      - name: Check code style
        shell: bash
        run: make -s check-style CS_ARGS=--format=checkstyle | cs2pr
