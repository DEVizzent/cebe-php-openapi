name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  phpunit:
    name: Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "lowest"
          - "highest"
        symfony-yaml: ['^6.4', '^7.4', '^8.0']
        include:
          - os: "windows-latest"
            php: "8.5"
            dependencies: "highest"
            symfony-yaml: '^7.4'
          - os: "macos-latest"
            php: "8.5"
            dependencies: "highest"
            symfony-yaml: '^7.4'
          # next PHP version: reports problems early, but does not fail the build
          - os: "ubuntu-latest"
            php: "8.6"
            dependencies: "highest"
            symfony-yaml: '^8.0'
            experimental: true
        exclude:
          # symfony/yaml v8 does not run on PHP < 8.4
          - php: '8.2'
            symfony-yaml: '^8.0'
          - php: '8.3'
            symfony-yaml: '^8.0'

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Require specific symfony/yaml version
        run: "composer require symfony/yaml:'${{ matrix.symfony-yaml }}' --no-interaction --ansi --no-install"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: Validate test data
        run: make lint

      - name: PHPUnit tests
        run: make test

      - name: Code coverage
        run: make coverage
